name: Build Lucky Wheel APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'LuckyWheelNative_AndroidStudio_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK from ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platforms and build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract project ZIP
        run: |
          test -f LuckyWheelNative_AndroidStudio_Project.zip
          mkdir -p extracted
          unzip -q LuckyWheelNative_AndroidStudio_Project.zip -d extracted
          test -f extracted/LuckyWheelNative/settings.gradle.kts

      - name: Fix Kotlin error
        run: |
          sed -i 's/fillViewport = true/isFillViewport = true/' extracted/LuckyWheelNative/app/src/main/java/com/example/luckywheel/MainActivity.kt

      - name: Build debug APK
        run: gradle --no-daemon -p extracted/LuckyWheelNative assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyWheel-debug-APK
          path: extracted/LuckyWheelNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
